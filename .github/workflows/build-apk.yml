name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APK files
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -print
          cp app/build/outputs/apk/release/*.apk out/DolphinLauncher.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/DolphinLauncher-debug.apk 2>/dev/null || true
          ls -la out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: DolphinLauncher-apk
          path: out/*.apk

      # ลิงก์ดาวน์โหลดตรงสำหรับมือถือ: หน้า Releases > "latest"
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dolphin Launcher (build ล่าสุด)
          prerelease: true
          make_latest: true
          files: out/*.apk
